### CI actions are pinned to immutable commit hashes, not mutable tags, to reduce supply-chain risk and help prevent LLM-based CI attacks. See https://github.com/lirantal/pypi-security-best-practices#13-secure-your-cicd-release-pipeline.
name: tests

on:
  # Run on every pushed branch.
  push:
  # Run on every pull request update.
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: "pytest"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      # pytest and the dataset validator are in the `dev` dependency group, which
      # `uv run` syncs by default. The `cpu` extra installs PyTorch without the CUDA
      # libraries, and the `mlcast` extra enables the mlcast integration tests.
      # GPU-only tests skip themselves when no CUDA device is available.
      - run: uv run --extra cpu --extra mlcast pytest -rs tests
